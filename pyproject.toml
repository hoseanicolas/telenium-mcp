[project]
name = "telenium-mcp"
version = "0.1.0"
description = "MCP server for remote automation of Kivy apps via Telenium"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "telenium>=0.5.0,<1.0.0",
]

[project.scripts]
telenium-mcp = "telenium_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telenium_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
